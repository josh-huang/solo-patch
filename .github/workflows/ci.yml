name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.17.5
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 = system python3 on Ubuntu 22.04 (production), 3.12 = local dev
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pgserver psycopg2-binary
      - name: Syntax check
        run: python -m py_compile alwayson.py store.py worker.py github_tasks.py
      - name: Tests
        run: python -I -m unittest discover -s tests -v
